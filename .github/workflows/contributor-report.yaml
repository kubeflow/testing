# Posts a contributor report on pull requests to this repository using the
# local copy of the contributor-report action.
name: Contributor Report

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-report:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    concurrency:
      group: contributor-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch, never the pull-request
      # head, so only trusted code runs with the write token.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/contributor-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
