name: Create Kind cluster

on:
  pull_request:
    paths:
      - .github/actions/create-cluster/**
      - .github/workflows/create-cluster.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-cluster:
    name: Kubernetes ${{ matrix.k8s_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s_version: v1.33.12
            node_image: kindest/node:v1.33.12
          - k8s_version: v1.36.1
            node_image: kindest/node:v1.36.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Kind cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}
          node_image: ${{ matrix.node_image }}

      - name: Verify cluster nodes
        shell: bash
        run: |
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
